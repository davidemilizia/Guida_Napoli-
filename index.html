<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guida Napoli</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Guida Napoli</h1>

<input type="text" id="search" placeholder="Cerca...">

<select id="giornoFiltro">
  <option value="">Tutti i giorni</option>
  <option value="1">Giorno 1</option>
  <option value="2">Giorno 2</option>
  <option value="3">Giorno 3</option>
  <option value="4">Giorno 4</option>
  <option value="5">Giorno 5</option>
  <option value="6">Giorno 6</option>
  <option value="7">Giorno 7</option>
  <option value="8">Giorno 8</option>
  <option value="9">Giorno 9</option>
</select>

<select id="categoriaFiltro">
  <option value="">Tutte le categorie</option>
  <option value="Monumento">Monumenti</option>
  <option value="Museo">Musei</option>
  <option value="Attrazione">Attrazioni</option>
  <option value="Ristorante">Ristoranti</option>
  <option value="Natura">Natura</option>
  <option value="Folklore">Folklore</option>
  <option value="Quartiere">Quartieri</option>
  <option value="Strada Importante">Strade Importanti</option>
</select>
  
</header>
<main id="contenitore"></main>
<script src="app.js"></script>
</body>
</html>
